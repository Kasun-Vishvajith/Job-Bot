<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign In · Kasun's Job Board</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23d97706'/><text x='50' y='72' font-family='sans-serif' font-size='70' font-weight='900' fill='%23ffffff' text-anchor='middle'>J</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
    :root {
      --void:      #fffdf7;
      --surface-0: #ffffff;
      --surface-2: #fef9f0;
      --surface-3: #fdf0d8;
      --rim:        rgba(0,0,0,0.14);
      --rim-strong: rgba(0,0,0,0.28);
      --orange:     #d97706;
      --orange-dim: rgba(217,119,6,0.10);
      --orange-pale:#f59e0b;
      --ink:   #1c1007;
      --ink-2: #3b2500;
      --ink-3: #8a7050;
      --green:  #15803d;
      --red:    #dc2626;
      --red-dim: rgba(220,38,38,0.10);
      --blue:   #1d4ed8;
      --teal:   #15803d;
      --rose:   #dc2626;
      --rose-dim: rgba(220,38,38,0.10);
      --amber:  #d97706;
      --r:   7px;
      --sh:  0 4px 32px rgba(0,0,0,0.09), 0 1px 6px rgba(0,0,0,0.05);
      --sh-field: 0 0 0 3px rgba(217,119,6,0.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }

    body {
      background: var(--void);
      color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 14.5px;
      line-height: 1.6;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 5% 0%, rgba(217,119,6,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 55% 50% at 95% 100%, rgba(21,128,61,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 40% 35% at 50% 50%, rgba(29,78,216,0.04) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      animation: drift linear infinite;
    }

    .blob-1 {
      width: 340px; height: 340px;
      background: radial-gradient(circle, rgba(217,119,6,0.07) 0%, transparent 70%);
      top: -100px; left: -100px;
      animation-duration: 22s;
    }

    .blob-2 {
      width: 280px; height: 280px;
      background: radial-gradient(circle, rgba(21,128,61,0.06) 0%, transparent 70%);
      bottom: -80px; right: -80px;
      animation-duration: 28s;
      animation-direction: reverse;
    }

    .blob-3 {
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(220,38,38,0.05) 0%, transparent 70%);
      top: 50%; right: 15%;
      animation-duration: 18s;
    }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      25%  { transform: translate(18px, -14px) scale(1.03); }
      50%  { transform: translate(8px, 20px) scale(0.97); }
      75%  { transform: translate(-14px, 8px) scale(1.02); }
      100% { transform: translate(0, 0) scale(1); }
    }

    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--surface-0);
      border: 2px solid rgba(0,0,0,0.18);
      border-radius: var(--r);
      box-shadow: var(--sh);
      overflow: hidden;
      position: relative;
    }

    .card-accent {
      height: 5px;
      background: linear-gradient(90deg, var(--orange) 0%, var(--amber) 35%, var(--red) 65%, var(--blue) 100%);
    }

    .card-inner {
      padding: 36px 36px 32px;
    }

    .login-brand {
      margin-bottom: 30px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--r);
      background: rgba(217,119,6,0.10);
      border: 2px solid rgba(0,0,0,0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      color: var(--orange);
    }

    .login-title {
      font-size: 26px;
      font-weight: 900;
      color: var(--ink);
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 5px;
    }

    .login-sub {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-3);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-2);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink-3);
      pointer-events: none;
      transition: color 150ms;
    }

    .form-input {
      width: 100%;
      height: 44px;
      background: var(--surface-2);
      border: 2px solid rgba(0,0,0,0.18);
      border-radius: var(--r);
      padding: 0 12px 0 40px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      color: var(--ink);
      outline: none;
      transition: border-color 150ms, box-shadow 150ms, background 150ms;
    }

    .form-input::placeholder { color: var(--ink-3); }

    .form-input:focus {
      border-color: var(--orange);
      background: #fff;
      box-shadow: var(--sh-field);
    }

    .form-input:focus + .input-icon,
    .input-wrap:focus-within .input-icon {
      color: var(--orange);
    }

    .pw-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      color: var(--ink-3);
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      transition: color 140ms, background 140ms;
    }

    .pw-toggle:hover {
      color: var(--orange);
      background: rgba(217,119,6,0.10);
    }

    .error-msg {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 13px;
      border-radius: var(--r);
      background: rgba(220,38,38,0.07);
      border: 1.5px solid rgba(220,38,38,0.28);
      color: var(--red);
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 16px;
      animation: shake 320ms ease;
    }

    .error-msg.show { display: flex; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-6px); }
      40%       { transform: translateX(6px); }
      60%       { transform: translateX(-4px); }
      80%       { transform: translateX(4px); }
    }

    .submit-btn {
      width: 100%;
      height: 46px;
      border-radius: var(--r);
      border: 2px solid rgba(0,0,0,0.25);
      background: var(--orange);
      color: #fff;
      font-size: 14.5px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: -0.01em;
      transition: background 150ms, transform 120ms, box-shadow 150ms;
      box-shadow: 0 4px 18px rgba(217,119,6,0.28);
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .submit-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%);
    }

    .submit-btn:hover {
      background: var(--orange-pale);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(217,119,6,0.35);
    }

    .submit-btn:active { transform: scale(0.98); }

    .submit-btn.loading {
      pointer-events: none;
      opacity: 0.8;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 600ms linear infinite;
    }

    .submit-btn.loading .spinner { display: block; }
    .submit-btn.loading .btn-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .login-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 11.5px;
      color: var(--ink-3);
      font-weight: 500;
    }

    .stats-strip {
      border-top: 2px solid rgba(0,0,0,0.10);
      padding: 16px 36px;
      display: flex;
      justify-content: center;
      gap: 32px;
      background: var(--surface-2);
    }

    .strip-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .strip-val {
      font-size: 18px;
      font-weight: 900;
      color: var(--ink);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .strip-val.violet { color: var(--orange); }
    .strip-val.teal   { color: var(--green); }
    .strip-val.rose   { color: var(--red); }

    .strip-lbl {
      font-size: 10px;
      font-weight: 700;
      color: var(--ink-3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .corner-dots {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      gap: 5px;
    }

    .corner-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .corner-dot:nth-child(1) { background: rgba(220,38,38,0.55); }
    .corner-dot:nth-child(2) { background: rgba(217,119,6,0.55); }
    .corner-dot:nth-child(3) { background: rgba(21,128,61,0.55); }

    .success-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(21,128,61,0.06);
      z-index: 10;
      align-items: center;
      justify-content: center;
      border-radius: var(--r);
    }

    .success-overlay.show {
      display: flex;
      animation: flash 400ms ease;
    }

    @keyframes flash {
      0%   { opacity: 0; }
      50%  { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="login-wrap">
    <div class="login-card">
      <div class="card-accent"></div>

      <div class="corner-dots">
        <div class="corner-dot"></div>
        <div class="corner-dot"></div>
        <div class="corner-dot"></div>
      </div>

      <div class="card-inner">
        <div class="login-brand">
          <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/>
              <rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
          </div>
          <h1 class="login-title">Welcome back.</h1>
          <p class="login-sub">Sign in to your Job Board</p>
        </div>

        <form id="loginForm" autocomplete="off">
          <div class="error-msg" id="errorMsg">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="errorText">Invalid username or password.</span>
          </div>

          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <div class="input-wrap">
              <input
                class="form-input"
                id="username"
                type="text"
                placeholder="Enter your username"
                autocomplete="username"
                spellcheck="false"
              >
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="input-wrap">
              <input
                class="form-input"
                id="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
              >
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <button type="button" class="pw-toggle" id="pwToggle" aria-label="Toggle password visibility">
                <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">
            <div class="spinner"></div>
            <span class="btn-text">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="margin-right:5px;vertical-align:middle">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                <polyline points="10 17 15 12 10 7"/>
                <line x1="15" y1="12" x2="3" y2="12"/>
              </svg>
              Sign In
            </span>
          </button>
        </form>

        <div class="login-footer">
          Kasun Vishvajith · Personal Job Tracker
        </div>
      </div>

      <div class="stats-strip">
        <div class="strip-stat">
          <div class="strip-val violet" id="statJobs">—</div>
          <div class="strip-lbl">Jobs Tracked</div>
        </div>
        <div class="strip-stat">
          <div class="strip-val teal" id="statPicked">—</div>
          <div class="strip-lbl">Picked</div>
        </div>
        <div class="strip-stat">
          <div class="strip-val rose" id="statSkills">—</div>
          <div class="strip-lbl">Skills Mapped</div>
        </div>
      </div>
    </div>
  </div>

<script>
  // ── Redirect if already logged in ──────────────────────────
  if (sessionStorage.getItem('jb-auth') === '1') {
    window.location.replace('index.html');
  }

  // ── Load live stats from localStorage ──────────────────────
  (function loadStats() {
    try {
      const custom = JSON.parse(localStorage.getItem('kasun-custom-jobs') || '{}');
      const picked = JSON.parse(localStorage.getItem('kasun-job-picked') || '{}');
      const db     = JSON.parse(localStorage.getItem('kasun-req-db') || '{}');

      const pickedCount = Object.values(picked).filter(Boolean).length;
      const skillCount  = db.skills ? Object.keys(db.skills).length : 0;
      const jobCount    = Object.keys(custom).length;

      if (jobCount > 0)    document.getElementById('statJobs').textContent    = jobCount;
      if (pickedCount > 0) document.getElementById('statPicked').textContent  = pickedCount;
      if (skillCount > 0)  document.getElementById('statSkills').textContent  = skillCount;
    } catch (_) {}
  })();

  // ── Auth credentials (simple client-side guard) ────────────
  const CREDS = { user: 'kasunvish', pass: "D0whatyoucan't" };

  // ── Password toggle ─────────────────────────────────────────
  const pwInput  = document.getElementById('password');
  const pwToggle = document.getElementById('pwToggle');
  const eyeIcon  = document.getElementById('eyeIcon');

  const eyeOpen   = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  const eyeClosed = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;

  pwToggle.addEventListener('click', () => {
    const isHidden = pwInput.type === 'password';
    pwInput.type = isHidden ? 'text' : 'password';
    eyeIcon.innerHTML = isHidden ? eyeClosed : eyeOpen;
  });

  // ── Form submit ─────────────────────────────────────────────
  const form      = document.getElementById('loginForm');
  const errorMsg  = document.getElementById('errorMsg');
  const errorText = document.getElementById('errorText');
  const submitBtn = document.getElementById('submitBtn');

  function showError(msg) {
    errorText.textContent = msg;
    errorMsg.classList.remove('show');
    // Force re-animation
    void errorMsg.offsetWidth;
    errorMsg.classList.add('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;

    if (!user || !pass) {
      showError('Please enter both username and password.');
      return;
    }

    // Show loading state
    submitBtn.classList.add('loading');
    errorMsg.classList.remove('show');

    // Fake async check for a polished feel
    await new Promise(r => setTimeout(r, 650));

    if (user === CREDS.user && pass === CREDS.pass) {
      sessionStorage.setItem('jb-auth', '1');
      // Brief success pulse before redirect
      submitBtn.style.background = 'var(--teal)';
      submitBtn.classList.remove('loading');
      submitBtn.querySelector('.btn-text').innerHTML = `
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="margin-right:5px;vertical-align:middle">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Welcome back!`;
      setTimeout(() => window.location.replace('index.html'), 550);
    } else {
      submitBtn.classList.remove('loading');
      const isUserWrong = user !== CREDS.user;
      showError(isUserWrong ? 'Username not recognised.' : 'Incorrect password. Try again.');
      // Shake the relevant field
      const field = isUserWrong
        ? document.getElementById('username')
        : document.getElementById('password');
      field.style.borderColor = 'var(--rose)';
      field.style.boxShadow   = '0 0 0 3px rgba(255,92,124,0.18)';
      setTimeout(() => {
        field.style.borderColor = '';
        field.style.boxShadow   = '';
      }, 1600);
    }
  });

  // ── Enter key from username goes to password ─────────────────
  document.getElementById('username').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      document.getElementById('password').focus();
    }
  });

  // ── Auto-focus username ──────────────────────────────────────
  document.getElementById('username').focus();
</script>
</body>
</html>
