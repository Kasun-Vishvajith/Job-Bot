<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign In · Kasun's Job Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --void: #f5f3ff;
      --surface-0: #ffffff;
      --surface-2: #f0eeff;
      --surface-3: #e4e0fc;
      --rim: rgba(109,86,255,0.14);
      --rim-strong: rgba(109,86,255,0.28);
      --blue: #6d56ff;
      --blue-pale: #8b77ff;
      --blue-dim: rgba(109,86,255,0.12);
      --ink: #1a1523;
      --ink-2: #3d3551;
      --ink-3: #8b80a8;
      --teal: #00b894;
      --teal-dim: rgba(0,184,148,0.12);
      --rose: #ff5c7c;
      --rose-dim: rgba(255,92,124,0.10);
      --amber: #f59e0b;
      --violet: #a855f7;
      --r: 4px;
      --sh: 0 8px 40px rgba(26,21,35,0.16), 0 2px 8px rgba(26,21,35,0.08);
      --sh-field: 0 0 0 3px rgba(109,86,255,0.16);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }

    body {
      background: var(--void);
      color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 14.5px;
      line-height: 1.6;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Animated background blobs */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 55% at 8% 5%, rgba(109,86,255,0.13) 0%, transparent 62%),
        radial-gradient(ellipse 50% 45% at 92% 95%, rgba(168,85,247,0.10) 0%, transparent 62%),
        radial-gradient(ellipse 40% 35% at 50% 50%, rgba(0,184,148,0.06) 0%, transparent 68%);
      pointer-events: none;
      z-index: 0;
    }

    /* Floating decorative elements */
    .blob {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      animation: drift linear infinite;
    }

    .blob-1 {
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(109,86,255,0.08) 0%, transparent 70%);
      top: -80px; left: -80px;
      animation-duration: 22s;
    }

    .blob-2 {
      width: 260px; height: 260px;
      background: radial-gradient(circle, rgba(0,184,148,0.07) 0%, transparent 70%);
      bottom: -60px; right: -60px;
      animation-duration: 28s;
      animation-direction: reverse;
    }

    .blob-3 {
      width: 180px; height: 180px;
      background: radial-gradient(circle, rgba(255,92,124,0.06) 0%, transparent 70%);
      top: 50%; right: 15%;
      animation-duration: 18s;
    }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      25%  { transform: translate(18px, -14px) scale(1.03); }
      50%  { transform: translate(8px, 20px) scale(0.97); }
      75%  { transform: translate(-14px, 8px) scale(1.02); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* Card container */
    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }

    /* Top accent bar */
    .login-card {
      background: var(--surface-0);
      border: 2px solid var(--rim);
      border-radius: var(--r);
      box-shadow: var(--sh);
      overflow: hidden;
      position: relative;
    }

    .card-accent {
      height: 4px;
      background: linear-gradient(90deg, var(--blue) 0%, var(--rose) 50%, var(--violet) 100%);
    }

    .card-inner {
      padding: 36px 36px 32px;
    }

    /* Brand section */
    .login-brand {
      margin-bottom: 30px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--r);
      background: var(--blue-dim);
      border: 2px solid rgba(109,86,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      color: var(--blue);
    }

    .login-title {
      font-size: 24px;
      font-weight: 900;
      color: var(--ink);
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 5px;
    }

    .login-sub {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-3);
    }

    /* Form */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-2);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink-3);
      pointer-events: none;
      transition: color 150ms;
    }

    .form-input {
      width: 100%;
      height: 42px;
      background: var(--surface-2);
      border: 2px solid var(--rim);
      border-radius: var(--r);
      padding: 0 12px 0 40px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      color: var(--ink);
      outline: none;
      transition: border-color 150ms, box-shadow 150ms, background 150ms;
    }

    .form-input::placeholder { color: var(--ink-3); }

    .form-input:focus {
      border-color: var(--blue);
      background: #fff;
      box-shadow: var(--sh-field);
    }

    .form-input:focus + .input-icon,
    .input-wrap:focus-within .input-icon {
      color: var(--blue);
    }

    /* Password toggle */
    .pw-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      color: var(--ink-3);
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      transition: color 140ms, background 140ms;
    }

    .pw-toggle:hover {
      color: var(--blue);
      background: var(--blue-dim);
    }

    /* Error message */
    .error-msg {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 13px;
      border-radius: var(--r);
      background: var(--rose-dim);
      border: 1.5px solid rgba(255,92,124,0.3);
      color: var(--rose);
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 16px;
      animation: shake 320ms ease;
    }

    .error-msg.show { display: flex; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-6px); }
      40%       { transform: translateX(6px); }
      60%       { transform: translateX(-4px); }
      80%       { transform: translateX(4px); }
    }

    /* Submit button */
    .submit-btn {
      width: 100%;
      height: 44px;
      border-radius: var(--r);
      border: none;
      background: var(--blue);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: -0.01em;
      transition: background 150ms, transform 120ms, box-shadow 150ms;
      box-shadow: 0 4px 16px rgba(109,86,255,0.35);
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .submit-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 60%);
    }

    .submit-btn:hover {
      background: var(--blue-pale);
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(109,86,255,0.45);
    }

    .submit-btn:active { transform: scale(0.98); }

    .submit-btn.loading {
      pointer-events: none;
      opacity: 0.8;
    }

    /* Spinner */
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 600ms linear infinite;
    }

    .submit-btn.loading .spinner { display: block; }
    .submit-btn.loading .btn-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer note */
    .login-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 11.5px;
      color: var(--ink-3);
      font-weight: 500;
    }

    /* Stats strip at bottom of card */
    .stats-strip {
      border-top: 2px solid var(--rim);
      padding: 14px 36px;
      display: flex;
      justify-content: center;
      gap: 28px;
      background: var(--surface-2);
    }

    .strip-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .strip-val {
      font-size: 16px;
      font-weight: 900;
      color: var(--ink);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .strip-val.violet { color: var(--blue); }
    .strip-val.teal   { color: var(--teal); }
    .strip-val.rose   { color: var(--rose); }

    .strip-lbl {
      font-size: 10px;
      font-weight: 700;
      color: var(--ink-3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Decorative corner dots */
    .corner-dots {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 5px;
    }

    .corner-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .corner-dot:nth-child(1) { background: rgba(255,92,124,0.5); }
    .corner-dot:nth-child(2) { background: rgba(245,158,11,0.5); }
    .corner-dot:nth-child(3) { background: rgba(0,184,148,0.5); }

    /* Success flash */
    .success-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,184,148,0.07);
      z-index: 10;
      align-items: center;
      justify-content: center;
      border-radius: var(--r);
    }

    .success-overlay.show {
      display: flex;
      animation: flash 400ms ease;
    }

    @keyframes flash {
      0%   { opacity: 0; }
      50%  { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="login-wrap">
    <div class="login-card">
      <div class="card-accent"></div>

      <div class="corner-dots">
        <div class="corner-dot"></div>
        <div class="corner-dot"></div>
        <div class="corner-dot"></div>
      </div>

      <div class="card-inner">
        <div class="login-brand">
          <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/>
              <rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
          </div>
          <h1 class="login-title">Welcome back.</h1>
          <p class="login-sub">Sign in to your Job Board</p>
        </div>

        <form id="loginForm" autocomplete="off">
          <div class="error-msg" id="errorMsg">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="errorText">Invalid username or password.</span>
          </div>

          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <div class="input-wrap">
              <input
                class="form-input"
                id="username"
                type="text"
                placeholder="Enter your username"
                autocomplete="username"
                spellcheck="false"
              >
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="input-wrap">
              <input
                class="form-input"
                id="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
              >
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <button type="button" class="pw-toggle" id="pwToggle" aria-label="Toggle password visibility">
                <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">
            <div class="spinner"></div>
            <span class="btn-text">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="margin-right:5px;vertical-align:middle">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                <polyline points="10 17 15 12 10 7"/>
                <line x1="15" y1="12" x2="3" y2="12"/>
              </svg>
              Sign In
            </span>
          </button>
        </form>

        <div class="login-footer">
          Kasun Vishvajith · Personal Job Tracker
        </div>
      </div>

      <div class="stats-strip">
        <div class="strip-stat">
          <div class="strip-val violet" id="statJobs">—</div>
          <div class="strip-lbl">Jobs Tracked</div>
        </div>
        <div class="strip-stat">
          <div class="strip-val teal" id="statPicked">—</div>
          <div class="strip-lbl">Picked</div>
        </div>
        <div class="strip-stat">
          <div class="strip-val rose" id="statSkills">—</div>
          <div class="strip-lbl">Skills Mapped</div>
        </div>
      </div>
    </div>
  </div>

<script>
  // ── Redirect if already logged in ──────────────────────────
  if (sessionStorage.getItem('jb-auth') === '1') {
    window.location.replace('index.html');
  }

  // ── Load live stats from localStorage ──────────────────────
  (function loadStats() {
    try {
      const custom = JSON.parse(localStorage.getItem('kasun-custom-jobs') || '{}');
      const picked = JSON.parse(localStorage.getItem('kasun-job-picked') || '{}');
      const db     = JSON.parse(localStorage.getItem('kasun-req-db') || '{}');

      const pickedCount = Object.values(picked).filter(Boolean).length;
      const skillCount  = db.skills ? Object.keys(db.skills).length : 0;
      const jobCount    = Object.keys(custom).length;

      if (jobCount > 0)    document.getElementById('statJobs').textContent    = jobCount;
      if (pickedCount > 0) document.getElementById('statPicked').textContent  = pickedCount;
      if (skillCount > 0)  document.getElementById('statSkills').textContent  = skillCount;
    } catch (_) {}
  })();

  // ── Auth credentials (simple client-side guard) ────────────
  const CREDS = { user: 'kasunvish', pass: "D0whatyoucan't" };

  // ── Password toggle ─────────────────────────────────────────
  const pwInput  = document.getElementById('password');
  const pwToggle = document.getElementById('pwToggle');
  const eyeIcon  = document.getElementById('eyeIcon');

  const eyeOpen   = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  const eyeClosed = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;

  pwToggle.addEventListener('click', () => {
    const isHidden = pwInput.type === 'password';
    pwInput.type = isHidden ? 'text' : 'password';
    eyeIcon.innerHTML = isHidden ? eyeClosed : eyeOpen;
  });

  // ── Form submit ─────────────────────────────────────────────
  const form      = document.getElementById('loginForm');
  const errorMsg  = document.getElementById('errorMsg');
  const errorText = document.getElementById('errorText');
  const submitBtn = document.getElementById('submitBtn');

  function showError(msg) {
    errorText.textContent = msg;
    errorMsg.classList.remove('show');
    // Force re-animation
    void errorMsg.offsetWidth;
    errorMsg.classList.add('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;

    if (!user || !pass) {
      showError('Please enter both username and password.');
      return;
    }

    // Show loading state
    submitBtn.classList.add('loading');
    errorMsg.classList.remove('show');

    // Fake async check for a polished feel
    await new Promise(r => setTimeout(r, 650));

    if (user === CREDS.user && pass === CREDS.pass) {
      sessionStorage.setItem('jb-auth', '1');
      // Brief success pulse before redirect
      submitBtn.style.background = 'var(--teal)';
      submitBtn.classList.remove('loading');
      submitBtn.querySelector('.btn-text').innerHTML = `
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="margin-right:5px;vertical-align:middle">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Welcome back!`;
      setTimeout(() => window.location.replace('index.html'), 550);
    } else {
      submitBtn.classList.remove('loading');
      const isUserWrong = user !== CREDS.user;
      showError(isUserWrong ? 'Username not recognised.' : 'Incorrect password. Try again.');
      // Shake the relevant field
      const field = isUserWrong
        ? document.getElementById('username')
        : document.getElementById('password');
      field.style.borderColor = 'var(--rose)';
      field.style.boxShadow   = '0 0 0 3px rgba(255,92,124,0.18)';
      setTimeout(() => {
        field.style.borderColor = '';
        field.style.boxShadow   = '';
      }, 1600);
    }
  });

  // ── Enter key from username goes to password ─────────────────
  document.getElementById('username').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      document.getElementById('password').focus();
    }
  });

  // ── Auto-focus username ──────────────────────────────────────
  document.getElementById('username').focus();
</script>
</body>
</html>
