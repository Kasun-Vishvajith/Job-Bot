# ============================================================
#  JOB ALERT BOT — Configuration File (EARLY-CAREER REMOTE + LOCAL SRI LANKA)
#  Personal job-search configuration
#  ============================================================
#
#  HOW TO USE:
#    1. Set GitHub Secrets: GMAIL_SENDER, GMAIL_RECIPIENT, GMAIL_APP_PASSWORD,
#       TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, GEMINI_API_KEY
#    2. Edit your profile keywords below
#    3. Enable/disable sources using `enabled: true/false`
#
#  MODE: Remote worldwide + any work type (remote/hybrid/on-site) in Sri Lanka
#        All scrapers use remote API filters for global queries, and
#        no remote filter for Sri Lanka/Colombo queries (to get all types).
#        The filter enforces: remote worldwide OR located in Sri Lanka.
# ============================================================

# ── YOUR PROFILE ──────────────────────────────────────────────────────────────
profile:
  name: "Candidate"

  # Keywords that describe you — the bot will match jobs containing these
  keywords:
    - "data science"
    - "data scientist"
    - "data analyst"
    - "junior data analyst"
    - "junior data scientist"
    - "AI engineer"
    - "AI/ML engineer"
    - "machine learning engineer"
    - "ML engineer"
    - "automation engineer"
    - "DevOps engineer"
    - "cloud engineer"
    - "data engineer"
    - "data scientist"
    - "data science engineer"
    - "data structures engineer"
    - "data infrastructure engineer"
    - "MLOps engineer"
    - "platform engineer"
    - "automotive data engineer"
    - "automotive software engineer"
    - "machine learning"
    - "ML intern"
    - "data engineer"
    - "analytics intern"
    - "business intelligence"
    - "BI intern"
    - "AI"
    - "artificial intelligence"
    - "deep learning"
    - "python"
    - "statistics"
    - "analytics"
    - "NLP"
    - "computer vision"
    - "data visualization"
    - "tableau"
    - "power BI"
    - "sql"
    - "r programming"

  # MUST-HAVE keywords — at least one of these MUST appear in the job
  # title or description. Jobs missing all of these are completely ignored.
  must_have_keywords:
    - "entry level"
    - "entry-level"
    - "junior"
    - "associate"
    - "graduate"
    - "new grad"
    - "0 years"
    - "1 year"
    - "2 years"
    - "3 years"
    - "no experience"
    - "fresh"
    - "fresher"

  # Words that indicate a job is TOO senior — will be filtered out
  exclude_keywords:
    - "10+ years"
    - "8+ years"
    - "7+ years"
    - "6+ years"
    - "5+ years"
    - "4+ years"
    - "4 years"
    - "senior manager"
    - "director"
    - "VP"
    - "vice president"
    - "head of"
    - "chief"
    - "principal"
    - "lead engineer"
    - "staff engineer"
    - "staff scientist"
    - "distinguished"

  # Work type preferences — all types accepted (filter handles the logic)
  work_types:
    - "remote"
    - "hybrid"
    - "on-site"

  # Location filtering rules
  location_rules:
    remote_worldwide: true          # Accept remote jobs from anywhere in the world
    onsite_allowed_cities:          # For hybrid/on-site, only these Sri Lanka locations
      - "colombo"
      - "sri lanka"
      - "lk"
      - "remote"                    # always keep remote-tagged listings
      - "western province"
      - "gampaha"
      - "kandy"


# ── JOB SITES TO SCRAPE ───────────────────────────────────────────────────────
job_sites:

  # ── Remote Job Board APIs (PRIMARY — most reliable, 100% remote) ────────────
  remote_job_boards:
    enabled: true
    max_results_per_source: 200
    request_timeout_seconds: 12
    # Broad local prefilter. API feeds are fetched once, then filtered in Python.
    match_keywords:
      - "artificial intelligence"
      - "ai engineer"
      - "machine learning"
      - "ml engineer"
      - "automation"
      - "devops"
      - "cloud engineer"
      - "data engineer"
      - "data scientist"
      - "data science"
      - "data infrastructure"
      - "mlops"
      - "platform engineer"
      - "automotive"
    search_terms:
      - "AI engineer"
      - "machine learning engineer"
      - "automation engineer"
      - "DevOps engineer"
      - "data engineer"
      - "junior data scientist"
      - "entry level AI engineer"
      - "graduate software engineer"
      - "MLOps engineer"
      - "platform engineer"
      - "automotive software engineer"
    sources:
      # --- Free JSON APIs (most reliable) ---
      - name: "Remotive"
        type: "remotive"
        enabled: true

      - name: "Arbeitnow"
        type: "arbeitnow"
        enabled: true

      - name: "RemoteOK"
        type: "remoteok"
        enabled: true

      - name: "Jobicy"
        type: "jobicy"
        enabled: true

      - name: "Himalayas"
        type: "himalayas"
        enabled: true

      # --- HTML scraping (may occasionally be blocked) ---
      - name: "We Work Remotely"
        type: "weworkremotely"
        enabled: false             # HTML + one request/query; poor Actions efficiency

      - name: "Remote.co"
        type: "remote_co"
        enabled: false             # HTML + frequent bot protection

      - name: "JustRemote"
        type: "justremote"
        enabled: false             # HTML + one request/query

      - name: "DailyRemote"
        type: "dailyremote"
        enabled: false             # HTML + one request/query

      - name: "We Work Remotely RSS"
        type: "rss"
        enabled: true
        default_location: "Worldwide Remote"
        work_type: "Remote"
        employment_type: "Full-time"
        feeds:
          - "https://weworkremotely.com/categories/remote-programming-jobs.rss"
          - "https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss"

      - name: "ITPro.lk"
        type: "rss"
        enabled: true
        default_location: "Sri Lanka"
        default_company: "ITPro.lk Employer"
        employment_type: "Full-time"
        feeds:
          - "https://itpro.lk/rss/ai-and-data/"
          - "https://itpro.lk/rss/devops-cloud/"
          - "https://itpro.lk/rss/software-engineering/"

      - name: "HiringCafe"
        type: "hiringcafe"
        enabled: false             # Enable once tested locally

      - name: "TheirStack"
        type: "theirstack"
        enabled: false             # Enable once tested locally

      # --- Greenhouse API (set companies list below) ---
      - name: "Greenhouse"
        type: "greenhouse"
        enabled: true
        # Greenhouse board slugs for companies known to hire data science interns
        companies:
          - "stripe"
          - "squarespace"
          - "shopify"
          - "palantir"
          - "zendesk"
          - "figma"
          - "brex"
          - "plaid"
          - "airtable"
          - "hubspot"
          - "canva"
          - "notion"

      - name: "Lever"
        type: "lever"
        enabled: true
        # One public API request per company. Mix of remote-first, AI/data,
        # infrastructure, and automotive/mobility employers.
        companies:
          - "waabi"
          - "zimperium"
          - "brightedge"
          - "jobgether"
          - "lingarogroup"
          - "elementsolutions"
          - "walkme"
          - "coupa"
          - "bluelightconsulting"

  # ── LinkedIn (f_WT=2 for Remote queries, no filter for SL queries) ──────────
  linkedin:
    enabled: true
    full_time_only: true
    experience_levels: ["2", "3"] # LinkedIn entry-level and associate filters
    search_queries:
      # International remote results explicitly surfaced for Sri Lanka.
      - { keywords: "AI engineer", location: "Sri Lanka", remote: true }
      - { keywords: "machine learning engineer", location: "Sri Lanka", remote: true }
      - { keywords: "automation engineer", location: "Sri Lanka", remote: true }
      - { keywords: "data engineer", location: "Sri Lanka", remote: true }
      - { keywords: "data scientist", location: "Sri Lanka", remote: true }
      - { keywords: "DevOps engineer", location: "Sri Lanka", remote: true }
      - { keywords: "cloud engineer", location: "Sri Lanka", remote: true }
      - { keywords: "MLOps engineer", location: "Sri Lanka", remote: true }
      # Sri Lankan roles of all work types.
      - { keywords: "AI engineer", location: "Sri Lanka", remote: false }
      - { keywords: "machine learning engineer", location: "Sri Lanka", remote: false }
      - { keywords: "automation engineer", location: "Sri Lanka", remote: false }
      - { keywords: "data engineer", location: "Sri Lanka", remote: false }
      - { keywords: "data scientist", location: "Sri Lanka", remote: false }
      - { keywords: "DevOps engineer", location: "Sri Lanka", remote: false }
      - { keywords: "cloud engineer", location: "Sri Lanka", remote: false }
      - { keywords: "MLOps engineer", location: "Sri Lanka", remote: false }
    max_pages: 2

  # ── Indeed (remote filter for Remote queries, none for SL queries) ───────────
  indeed:
    enabled: false                 # Usually blocked; saves dozens of Actions requests
    search_queries:
      # Remote worldwide (uses Indeed's remote filter)
      - { keywords: "data science intern", location: "Remote" }
      - { keywords: "data analyst intern", location: "Remote" }
      - { keywords: "machine learning intern", location: "Remote" }
      - { keywords: "AI intern", location: "Remote" }
      - { keywords: "analytics intern", location: "Remote" }
      - { keywords: "junior data analyst", location: "Remote" }
      - { keywords: "junior data scientist", location: "Remote" }
      - { keywords: "entry level data analyst", location: "Remote" }
      - { keywords: "entry level data scientist", location: "Remote" }
      - { keywords: "graduate data analyst", location: "Remote" }
      - { keywords: "new grad data scientist", location: "Remote" }
      - { keywords: "python data intern", location: "Remote" }
      - { keywords: "NLP intern", location: "Remote" }
      - { keywords: "deep learning intern", location: "Remote" }
      # Sri Lanka / Colombo (NO remote filter — all work types)
      - { keywords: "data science intern", location: "Colombo, Sri Lanka" }
      - { keywords: "data analyst intern", location: "Colombo, Sri Lanka" }
      - { keywords: "machine learning intern", location: "Colombo, Sri Lanka" }
      - { keywords: "AI intern", location: "Colombo, Sri Lanka" }
      - { keywords: "analytics intern", location: "Colombo, Sri Lanka" }
      - { keywords: "junior data analyst", location: "Colombo, Sri Lanka" }
      - { keywords: "junior data scientist", location: "Colombo, Sri Lanka" }
      - { keywords: "entry level data analyst", location: "Colombo, Sri Lanka" }
      - { keywords: "graduate data analyst", location: "Colombo, Sri Lanka" }
      - { keywords: "data science intern", location: "Sri Lanka" }
      - { keywords: "data analyst intern", location: "Sri Lanka" }
      - { keywords: "junior data analyst", location: "Sri Lanka" }
    location: "Sri Lanka"           # default fallback location
    max_pages: 3

  # ── Glassdoor (remoteWorkType=1 for Remote queries, none for SL) ────────────
  glassdoor:
    enabled: false                 # Usually blocked; saves Actions minutes
    search_queries:
      # Remote worldwide (uses remoteWorkType=1)
      - { keywords: "data science intern", location: "Remote" }
