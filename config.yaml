# ── NOTIFICATIONS ──────────────────────────────────────────────────────────────
notifications:
  email:
    enabled: true
    sender: "your-gmail@gmail.com"       # ← set via GMAIL_SENDER secret
    recipient: "your-email@gmail.com"    # ← set via GMAIL_RECIPIENT secret

  telegram:
    enabled: true
    # Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID as GitHub Secrets


# ── SCHEDULE ──────────────────────────────────────────────────────────────────
schedule:
  # Twice daily at midnight and noon Sri Lanka time (UTC+5:30)
  times_utc: ["06:30", "18:30"]


# ── FILTERING ─────────────────────────────────────────────────────────────────
filtering:
  remote_only: true                 # GATE: remote worldwide OR any type in Sri Lanka
  min_keyword_matches: 1
  prefer_salary_listed: true
  max_age_days: 14
  strict_keyword_filtering: false
  enforce_entry_level: true
  permanent_only: true
  max_years_experience: 3
  require_sri_lanka_remote_eligibility: true
  remote_eligibility_keywords:
    - "worldwide"
    - "anywhere"
    - "global remote"
    - "work from anywhere"
    - "sri lanka"
    - "asia"
    - "apac"
    - "all countries"
  entry_level_keywords:
    - "entry level"
    - "entry-level"
    - "junior"
    - "associate"
    - "graduate"
    - "new grad"
    - "0 years"
    - "1 year"
    - "2 years"
    - "3 years"
    - "zero years"
    - "no experience"
    - "fresh"
    - "fresher"
    - "recent graduate"
    - "early career"


# ── AI SUITABILITY FILTERING ──────────────────────────────────────────────────
ai_filtering:
  enabled: true
  min_suitability_score: 70       # Filter out jobs below this score (0-100)
  model: "gemini-2.5-flash"       # Cost-efficient, high-speed model
  max_jobs_per_run: 120           # At most 6 Gemini batches within the 45-minute run
