# ============================================================
#  JOB ALERT BOT — Configuration File
#  Kasun Vishvajith Vithanage | BSc Hons Data Science | UoC
#  ============================================================
#
#  HOW TO USE:
#    1. Set GitHub Secrets: GMAIL_SENDER, GMAIL_RECIPIENT, GMAIL_APP_PASSWORD,
#       TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, GEMINI_API_KEY
#    2. Edit your profile keywords below
#    3. Enable/disable sources using `enabled: true/false`
# ============================================================

# ── YOUR PROFILE ──────────────────────────────────────────────────────────────
profile:
  name: "Kasun Vishvajith Vithanage"

  # Keywords that describe you — the bot will match jobs containing these
  keywords:
    - "data science"
    - "data scientist"
    - "data analyst"
    - "junior data analyst"
    - "junior data scientist"
    - "data science intern"
    - "data analyst intern"
    - "machine learning intern"
    - "machine learning"
    - "ML intern"
    - "data engineer"
    - "analytics intern"
    - "business intelligence"
    - "BI intern"
    - "AI"
    - "artificial intelligence"
    - "deep learning"
    - "python"
    - "statistics"
    - "analytics"
    - "NLP"
    - "computer vision"
    - "data visualization"
    - "tableau"
    - "power BI"
    - "sql"
    - "r programming"

  # MUST-HAVE keywords — at least one of these MUST appear in the job
  # title or description. Jobs missing all of these are completely ignored.
  must_have_keywords:
    - "intern"
    - "internship"
    - "trainee"
    - "placement"
    - "entry level"
    - "entry-level"
    - "junior"
    - "associate"
    - "graduate"
    - "new grad"
    - "student"
    - "apprentice"
    - "0 years"
    - "no experience"
    - "fresh"
    - "fresher"

  # Words that indicate a job is TOO senior — will be filtered out
  exclude_keywords:
    - "10+ years"
    - "8+ years"
    - "7+ years"
    - "6+ years"
    - "5+ years"
    - "4+ years"
    - "senior manager"
    - "director"
    - "VP"
    - "vice president"
    - "head of"
    - "chief"
    - "principal"
    - "lead engineer"
    - "staff engineer"
    - "staff scientist"
    - "distinguished"

  # Work type preferences
  work_types:
    - "remote"
    - "hybrid"
    - "on-site"

  # Location filtering rules
  location_rules:
    remote_worldwide: true          # Accept remote jobs from anywhere in the world
    onsite_allowed_cities:          # For hybrid/on-site, only these locations
      - "colombo"
      - "sri lanka"
      - "lk"
      - "remote"                    # always keep remote-tagged listings
      - "western province"
      - "gampaha"
      - "kandy"


# ── JOB SITES TO SCRAPE ───────────────────────────────────────────────────────
job_sites:

  # ── Remote Job Board APIs (most reliable — less blocking) ──────────────────
  remote_job_boards:
    enabled: true
    max_results_per_source: 100
    search_terms:
      - "data science intern"
      - "data analyst intern"
      - "machine learning intern"
      - "AI intern"
      - "analytics intern"
      - "business intelligence intern"
      - "junior data analyst"
      - "junior data scientist"
      - "entry level data analyst"
      - "entry level data scientist"
      - "graduate data analyst"
      - "new grad data scientist"
      - "python data intern"
      - "NLP intern"
      - "computer vision intern"
      - "deep learning intern"
      - "data engineering intern"
    sources:
      # --- Free JSON APIs (most reliable) ---
      - name: "Remotive"
        type: "remotive"
        enabled: true

      - name: "Arbeitnow"
        type: "arbeitnow"
        enabled: true

      - name: "RemoteOK"
        type: "remoteok"
        enabled: true

      - name: "Jobicy"
        type: "jobicy"
        enabled: true

      # --- HTML scraping (may occasionally be blocked) ---
      - name: "We Work Remotely"
        type: "weworkremotely"
        enabled: true

      - name: "Remote.co"
        type: "remote_co"
        enabled: true

      - name: "HiringCafe"
        type: "hiringcafe"
        enabled: false             # Enable once tested locally

      - name: "TheirStack"
        type: "theirstack"
        enabled: false             # Enable once tested locally

      # --- Greenhouse API (set companies list below) ---
      - name: "Greenhouse"
        type: "greenhouse"
        enabled: true
        # Greenhouse board slugs for companies known to hire data science interns
        companies:
          - "stripe"
          - "squarespace"
          - "shopify"
          - "palantir"
          - "zendesk"
          - "figma"
          - "brex"
          - "plaid"
          - "airtable"
          - "hubspot"
          - "canva"
          - "notion"

  # ── LinkedIn ────────────────────────────────────────────────────────────────
  linkedin:
    enabled: true
