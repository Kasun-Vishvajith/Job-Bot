# --- YOUR PROFILE ---
profile:
  name: "Kasun Vishvajith Vithanage"

  # Keywords that describe you — the bot will match jobs containing these
  keywords:
    - "data science"
    - "data scientist"
    - "data analyst"
    - "junior data analyst"
    - "junior data scientist"
    - "data science intern"
    - "data analyst intern"
    - "machine learning intern"
    - "machine learning"
    - "ML intern"
    - "data engineer"
    - "analytics intern"
    - "business intelligence"
    - "BI intern"
    - "AI"
    - "artificial intelligence"
    - "deep learning"
    - "python"
    - "statistics"
    - "analytics"


  # MUST-HAVE keywords — at least one of these MUST appear in the job title
  # or description. Jobs missing all of these are completely ignored.
  must_have_keywords:
    - "intern"
    - "internship"
    - "trainee"
    - "placement"
    - "entry level"
    - "entry-level"
    - "junior"
    - "associate"
    - "graduate"
    - "new grad"
    - "student"
    - "apprentice"
    - "0 years"
    - "no experience"

  # Words that indicate a job is TOO senior — will be filtered out
  exclude_keywords:
    - "10+ years"
    - "8+ years"
    - "7+ years"
    - "6+ years"
    - "5+ years"
    - "senior manager"
    - "director"
    - "VP"
    - "vice president"
    - "head of"
    - "chief"
    - "principal"
    - "lead engineer"
    - "staff engineer"

  # Work type rules:
  # - remote: anywhere in the world
  # - hybrid / on-site: Colombo, Sri Lanka only (filtered in location_rules below)
  work_types:
    - "remote"
    - "hybrid"
    - "on-site"

  # Location filtering rules
  location_rules:
    remote_worldwide: true          # Accept remote jobs from anywhere
    onsite_allowed_cities:          # For hybrid/on-site, only these locations
      - "colombo"
      - "sri lanka"
      - "lk"
      - "remote"                    # always keep remote tagged ones

