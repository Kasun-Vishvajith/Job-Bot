# --- NOTIFICATIONS ---
notifications:
  email:
    enabled: true
    sender: "your-gmail@gmail.com"       # ← replace with your Gmail
    recipient: "your-email@gmail.com"    # ← replace with your email

  telegram:
    enabled: true
    # Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID as GitHub Secrets

# --- SCHEDULE ---
schedule:
  # Every 3 hours — Sri Lanka time (UTC+5:30)
  # 12am, 3am, 6am, 9am, 12pm, 3pm, 6pm, 9pm LKT
  times_utc: ["18:30", "21:30", "00:30", "03:30", "06:30", "09:30", "12:30", "15:30"]

# --- FILTERING ---
filtering:
  min_keyword_matches: 1
  prefer_salary_listed: true
  max_age_days: 7
  strict_keyword_filtering: false
  enforce_entry_level: true
  max_years_experience: 1
  entry_level_keywords:
    - "intern"
    - "internship"
    - "trainee"
    - "placement"
    - "entry level"
    - "entry-level"
    - "junior"
    - "associate"
    - "graduate"
    - "new grad"
    - "student"
    - "apprentice"
    - "0 years"
    - "zero years"
    - "no experience"

# --- AI SUITABILITY FILTERING ---
ai_filtering:
  enabled: true
  min_suitability_score: 70       # Filter out jobs below this suitability score (0-100)
  model: "gemini-2.5-flash"       # Cost-efficient, high-speed model
