name: Job Alert Bot

on:
  schedule:
    - cron: "30 6,18 * * *" # 12:00 and 00:00 LKT
  workflow_dispatch:          # Allow manual trigger from GitHub UI

permissions:
  contents: read

concurrency:
  group: daily-job-alert
  cancel-in-progress: true

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    # Public-repository standard runners do not consume private Actions minutes.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Job Alert Bot
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          python collector.py 2>&1 | tee job-bot.log

      - name: Publish search summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Job Bot search summary"
            echo
            echo '```text'
            grep -E "TOTAL raw|After keyword filter|Database gate result|NEW candidates|After AI filter|No new matching|scraper FAILED|listings in" job-bot.log || echo "Collector did not produce a search summary."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
