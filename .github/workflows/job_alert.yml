name: Job Alert Bot

on:
  schedule:
    - cron: "30 18 * * *"   # Once daily at 00:00 LKT (midnight)
  workflow_dispatch:          # Allow manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: daily-job-alert
  cancel-in-progress: true

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    # Hard ceiling; normal API-first runs should finish well below this.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Job Alert Bot
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit updated job database
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Job Alert Bot"
          git add data/seen_jobs.json data/seen_jobs.js
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git stash
          git pull origin main --no-rebase
          git stash pop || true
          git add data/seen_jobs.json data/seen_jobs.js
          git diff --staged --quiet && echo "No new changes after merge" && exit 0
          git commit -m "chore: update job database [skip ci]"
          git push
